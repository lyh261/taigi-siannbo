<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毓繡的台語課・聲母</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;900&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&text=%E6%AF%93%E7%B9%A1%E7%9A%84%E5%8F%B0%E8%AA%9E%E8%AA%B2&display=swap">
<style>
/* Layout: one sheet of rice paper, centred; cover = branch top-left, brush-ink title, seal, distant mountains fading into the paper */
:root {
  --paper: #f6f0e3;
  --paper-deep: #ece3d0;
  --ink: #2b2723;
  --ink-soft: #6d6459;
  --seal: #b23a2c;
  --leaf: #6f8a68;
  --mist: #8fa5b3;
  --good: #4f7d4a;
  --bad: #b23a2c;
  --line: #d9cdb6;
  --f-callig: "Yuji Boku", "LXGW WenKai TC", "DFKai-SB", serif;
  --f-brush: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --f-body: "Noto Serif TC", "PMingLiU", serif;
  --f-lo: "Gentium Book Plus", "Charis SIL", "Doulos SIL", "Times New Roman", serif;
  color-scheme: light;
}
html, body { min-height: 100%; }
body {
  background: var(--paper-deep);
  color: var(--ink);
  font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
}
.sheet {
  position: relative;
  max-width: 600px;
  margin: 0 auto;
  background: var(--paper);
  border-radius: 4px;
  box-shadow: 0 1px 0 #fff8 inset, 0 10px 30px #6d645922;
  overflow: hidden;
  isolation: isolate;
}
.sheet::before { /* paper fibre */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background:
    radial-gradient(circle at 20% 30%, #fff9 0 1px, transparent 2px) 0 0/23px 29px,
    radial-gradient(circle at 70% 60%, #d9cdb655 0 1px, transparent 2px) 0 0/31px 19px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; }
.lo { font-family: var(--f-lo); }

/* ---------- cover ---------- */
#cover { position: relative; padding: 0 0 22px; }
.branch { position: absolute; left: 0; top: 0; width: 46%; max-width: 270px; pointer-events: none; }
.branch-r { position: absolute; right: 0; top: 36%; width: 20%; max-width: 110px; pointer-events: none; }
.birds { position: absolute; right: 6%; top: 40px; width: 72px; pointer-events: none; }
.title-block { position: relative; padding: 92px 24px 0 34%; display: grid; gap: 6px; }
.title-block h1 {
  font-family: var(--f-callig); font-weight: 400; margin: 0;
  font-size: clamp(50px, 14vw, 84px); line-height: 1.1; letter-spacing: .02em;
  filter: url(#ink);
}
.title-block h1 span { display: block; }
.title-block h1 span + span { padding-left: .55em; }
.title-lo {
  font-family: var(--f-lo); font-size: clamp(18px, 4.6vw, 24px); color: var(--ink);
  letter-spacing: .03em; margin-top: 6px; padding-left: .2em;
}
.sub {
  display: flex; align-items: center; gap: 12px; margin-top: 12px;
  font-family: var(--f-brush); font-size: clamp(20px, 5.4vw, 27px); letter-spacing: .12em;
}
.seal-row { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 22px 0 6px; }
.seal-row::before, .seal-row::after { content: ""; height: 1px; width: 26%; background: linear-gradient(90deg, transparent, var(--seal)); opacity: .55; }
.seal-row::after { transform: scaleX(-1); }
.seal {
  width: 46px; height: 46px; border-radius: 50%; background: var(--seal); color: var(--paper);
  display: grid; place-items: center; font-family: var(--f-brush); font-size: 26px; font-weight: 700;
  box-shadow: 0 0 0 2px var(--paper) inset, 0 0 0 3px #b23a2c88 inset;
}
.scene { display: block; width: 100%; margin-top: -6px; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }

.cover-panel { display: grid; gap: 14px; padding: 0 28px; position: relative; margin-top: -8px; }
.best {
  display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 2px;
}
.best-label { font-family: var(--f-brush); font-size: 24px; letter-spacing: .12em; }
.best-when { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.best-when:empty { display: none; }
.best-val { font-size: 64px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--seal); }
.best-val small { font-size: 22px; font-weight: 400; color: var(--ink-soft); margin-left: 4px; }
.best-none { font-size: 18px; color: var(--ink-soft); margin-top: 4px; }
.btn-main {
  background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 14px 18px;
  font-family: var(--f-brush); font-size: 22px; letter-spacing: .3em; transition: transform .12s, background .2s;
}
.btn-main:hover { background: #3d3732; }
.btn-main:active { transform: translateY(1px); }
.btn-ghost {
  background: transparent; border: 1px solid var(--ink-soft); border-radius: 3px; padding: 10px 14px;
  font-family: var(--f-brush); font-size: 17px; letter-spacing: .1em;
}
.btn-ghost.big { padding: 14px 18px; font-size: 22px; letter-spacing: .2em; border: 2px solid var(--ink); }
.rule { font-size: 14px; color: var(--ink-soft); line-height: 1.75; margin: 0; }
.source {
  font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 4px 0 0;
  border-left: 3px solid var(--seal); padding-left: 10px;
}
.source a { color: var(--ink); }

/* ---------- quiz ---------- */
#quiz, #result { padding: 22px 24px 28px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-brush); }
.bar .qno { font-size: 20px; letter-spacing: .08em; }
.bar .score { font-size: 18px; }
.bar .score b { font-family: var(--f-body); font-size: 24px; color: var(--seal); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; margin: 12px 0 0; }
.dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.ok { background: var(--good); }
.dots i.no { background: var(--bad); }
.dots i.part { background: linear-gradient(90deg, var(--good) 50%, var(--bad) 50%); }
.dots i.now { background: var(--ink); }

.word {
  margin: 22px auto 6px; display: grid; grid-template-columns: auto auto auto; justify-content: center; align-items: end; gap: 14px 4px;
}
.word .han { font-family: var(--f-brush); font-size: clamp(54px, 16vw, 82px); line-height: 1; text-align: center; padding-bottom: 8px; border-bottom: 3px solid transparent; }
.word .han.now { border-bottom-color: var(--seal); }
.word .rom { font-family: var(--f-lo); font-size: clamp(34px, 9.5vw, 46px); line-height: 1.2; text-align: center; white-space: nowrap; }
.word .hy { color: var(--ink-soft); }
.blank {
  position: relative; display: inline-block; min-width: .7em; padding: 0 1px; text-align: center;
  border-bottom: 3px solid var(--line); color: var(--ink-soft); font-weight: 700;
}
.blank.now { border-color: var(--seal); color: var(--seal); background: #b23a2c14; }
.blank.picked { color: var(--ink); border-color: var(--ink); }
.blank.ok { color: var(--good); border-color: var(--good); }
.blank.no { color: var(--bad); border-color: var(--bad); }
.blank s { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font-weight: 400; font-size: .5em; color: var(--ink-soft); }

.play {
  display: flex; align-items: center; gap: 10px; margin: 14px auto 4px; padding: 10px 20px;
  background: transparent; border: 1px solid var(--ink); border-radius: 999px; font-family: var(--f-brush); font-size: 18px;
}
.play svg { width: 22px; height: 22px; }
.play.on { background: var(--ink); color: var(--paper); }

.prompt { text-align: center; font-family: var(--f-brush); font-size: 18px; margin: 16px 0 10px; letter-spacing: .06em; }
.keys { display: grid; gap: 10px; }
.krow { display: grid; grid-template-columns: 4.2em 1fr; gap: 8px; align-items: center; }
.krow .gname { font-size: 15px; color: var(--ink-soft); text-align: right; letter-spacing: .08em; }
.kbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  font-family: var(--f-lo); font-size: 34px; font-weight: 700; line-height: 1.1; padding: 12px 0; color: var(--ink);
  background: #fffdf7; border: 2px solid #b9ab92; border-radius: 6px; transition: transform .1s, background .15s, border-color .15s;
}
.key:hover:not(:disabled) { border-color: var(--ink); background: #fff; }
.key:active:not(:disabled) { transform: translateY(1px); }
.key:disabled { opacity: .55; cursor: default; }

.feedback { min-height: 30px; text-align: center; margin: 14px 0 0; font-size: 17px; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--bad); }
.next-row { display: flex; justify-content: center; margin-top: 10px; }
.next-row .btn-main { min-width: 60%; }

/* ---------- result ---------- */
.res-head { display: grid; justify-items: center; gap: 4px; margin: 8px 0 18px; text-align: center; }
.res-head h2 { font-family: var(--f-brush); font-size: 28px; margin: 0; letter-spacing: .12em; }
.big { font-size: 72px; font-weight: 900; line-height: 1; color: var(--seal); font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; color: var(--ink-soft); font-weight: 400; }
.new-best { font-family: var(--f-brush); color: var(--paper); background: var(--seal); padding: 2px 12px; border-radius: 2px; letter-spacing: .15em; }
h3 { font-family: var(--f-brush); font-size: 20px; letter-spacing: .1em; margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.review li {
  display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
  padding: 7px 4px; border-bottom: 1px dashed var(--line);
}
.review .mark { font-weight: 900; text-align: center; }
.review .mark.ok { color: var(--good); }
.review .mark.no { color: var(--bad); }
.review .rh { font-family: var(--f-brush); font-size: 20px; }
.review .rl { font-family: var(--f-lo); font-size: 17px; }
.review .ri { font-family: var(--f-lo); font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
.review .ri .x { color: var(--bad); }
.review .say { border: 0; background: none; padding: 2px; color: var(--ink-soft); }
.review .say svg { width: 18px; height: 18px; display: block; }
.table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--paper-deep); font-weight: 600; font-size: 13px; letter-spacing: .08em; }
td.sc { font-weight: 700; text-align: right; }
th.sc { text-align: right; }
tr.top td.sc { color: var(--seal); }
tr.cur td { background: #f0e4c8; }
.empty { padding: 14px; color: var(--ink-soft); font-size: 14px; text-align: center; }
.res-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.clear-zone { margin-top: 14px; display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.link-btn { background: none; border: 0; text-decoration: underline; color: var(--ink-soft); font-size: 13px; padding: 4px; }
.link-btn.danger { color: var(--bad); }

@media (max-width: 440px) {
  .title-block { padding: 78px 16px 0 30%; }
  .cover-panel, #quiz, #result { padding-left: 18px; padding-right: 18px; }
  .krow { grid-template-columns: 1fr; gap: 4px; }
  .krow .gname { text-align: left; }
  .key { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes fall { from { transform: translate(0, -10px) rotate(0); opacity: 0 } 15% { opacity: .9 } to { transform: translate(-40px, 260px) rotate(200deg); opacity: 0 } }
.petal { position: absolute; width: 9px; height: 13px; border-radius: 60% 60% 50% 50%; background: #fffdf4; border: 1px solid #d9cdb6; animation: fall 9s linear infinite; pointer-events: none; }
</style>

<div class="sheet">

  <!-- ===== cover ===== -->
  <section id="cover">
    <svg class="branch" viewBox="0 0 270 330" aria-hidden="true">
      <defs>
        <g id="fl">
          <g fill="#fffdf6" stroke="#d8ccb0" stroke-width=".8">
            <ellipse cx="0" cy="-9" rx="6.5" ry="9"/>
            <ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(72)"/>

          </g>
          <circle r="3.4" fill="#e9b85a"/>
          <g stroke="#c9952f" stroke-width=".8"><path d="M0 0 L0 -6 M0 0 L5 -3 M0 0 L4 4 M0 0 L-4 4 M0 0 L-5 -3"/></g>
        </g>
        <path id="lf" d="M0 0 C 8 -6 22 -6 30 0 C 22 6 8 6 0 0 Z"/>
      </defs>
      <path d="M-10 40 C 50 60 90 70 140 110 M40 52 C 60 110 70 150 66 210 M90 75 C 120 90 170 90 210 80 M66 160 C 40 200 30 240 34 300" fill="none" stroke="#7b6a55" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="#6f8a68" opacity=".85">
        <use href="#lf" transform="translate(30 40) rotate(30) scale(1.4)"/>
        <use href="#lf" transform="translate(70 62) rotate(-40) scale(1.2)"/>

        <use href="#lf" transform="translate(200 82) rotate(10) scale(1.2)"/>
        <use href="#lf" transform="translate(60 130) rotate(110) scale(1.4)"/>
        <use href="#lf" transform="translate(66 190) rotate(70) scale(1.3)"/>
        <use href="#lf" transform="translate(50 220) rotate(150) scale(1.2)"/>
        <use href="#lf" transform="translate(36 270) rotate(80) scale(1.3)"/>
      </g>
      <g fill="#93a98a" opacity=".8">

      <use href="#fl" transform="translate(140 112) scale(1.2)"/>

      <use href="#fl" transform="translate(186 74) scale(.9)"/>
      <use href="#fl" transform="translate(52 238) scale(1.15)"/>
      <use href="#fl" transform="translate(28 300) scale(.9)"/>
    </svg>
    <svg class="birds" viewBox="0 0 72 40" aria-hidden="true"><g fill="none" stroke="#7d93a3" stroke-width="2" stroke-linecap="round"><path d="M40 10 q6 -6 12 0 q6 -6 12 -2"/><path d="M8 28 q5 -5 10 0 q5 -5 10 -1"/></g></svg>
    <svg class="branch-r" viewBox="0 0 110 150" aria-hidden="true">
      <path d="M120 20 C 80 40 60 70 50 120" fill="none" stroke="#7b6a55" stroke-width="2" stroke-linecap="round"/>
      <g fill="#6f8a68" opacity=".85">
        <path d="M0 0 C 8 -6 22 -6 30 0 C 22 6 8 6 0 0 Z" transform="translate(70 40) rotate(150) scale(1.2)"/>
        <path d="M0 0 C 8 -6 22 -6 30 0 C 22 6 8 6 0 0 Z" transform="translate(58 80) rotate(200) scale(1.1)"/>
        <path d="M0 0 C 8 -6 22 -6 30 0 C 22 6 8 6 0 0 Z" transform="translate(56 100) rotate(60) scale(1.1)"/>
      </g>
      <g transform="translate(82 30) scale(1.2)"><g fill="#fffdf6" stroke="#d8ccb0" stroke-width=".8"><ellipse cx="0" cy="-9" rx="6.5" ry="9"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(72)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(144)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(216)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(288)"/></g><circle r="3.4" fill="#e9b85a"/></g>
      <g transform="translate(60 64)"><g fill="#fffdf6" stroke="#d8ccb0" stroke-width=".8"><ellipse cx="0" cy="-9" rx="6.5" ry="9"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(72)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(144)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(216)"/><ellipse cx="0" cy="-9" rx="6.5" ry="9" transform="rotate(288)"/></g><circle r="3.4" fill="#e9b85a"/></g>
    </svg>
    <span class="petal" style="left:58%;top:8%;animation-delay:-2s" aria-hidden="true"></span>
    <span class="petal" style="left:80%;top:2%;animation-delay:-6s" aria-hidden="true"></span>
    <span class="petal" style="left:30%;top:20%;animation-delay:-4s;animation-duration:11s" aria-hidden="true"></span>

    <div class="title-block">
      <h1><span>毓繡的</span><span>台語課</span></h1>
      <div class="title-lo">Io̍k-siù ê Tâi-gí-khò</div>
      <div class="sub">台羅拼音－聲母</div>
    </div>
    <div class="seal-row"><div class="seal" aria-hidden="true">台</div></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation=".35"/>
      </filter>
    </svg>

    <svg class="scene" viewBox="0 0 600 150" aria-hidden="true">
      <defs>
        <filter id="wash" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <path d="M0 120 C 60 70 110 60 170 92 C 220 50 280 40 340 88 C 380 70 430 72 470 96 L600 100 L600 160 L0 160 Z" fill="#b9c8d1" filter="url(#wash)" opacity=".7"/>
      <path d="M0 140 C 70 104 130 100 190 126 C 240 108 300 110 360 132 L600 136 L600 170 L0 170 Z" fill="#8fa5b3" filter="url(#wash)" opacity=".75"/>
      <g fill="#b7c2c6" opacity=".9">
        <rect x="400" y="104" width="12" height="38"/><rect x="416" y="114" width="10" height="28"/><rect x="430" y="96" width="9" height="46"/>
        <rect x="444" y="62" width="16" height="80"/><rect x="447" y="52" width="10" height="12"/><rect x="451" y="40" width="2" height="12"/>
        <rect x="466" y="110" width="12" height="32"/><rect x="482" y="100" width="10" height="42"/><rect x="497" y="116" width="14" height="26"/><rect x="516" y="106" width="9" height="36"/><rect x="530" y="118" width="16" height="24"/>
      </g>
    </svg>

    <div class="cover-panel">
      <div class="best" aria-live="polite">
        <div>
          <div class="best-label">最高成績</div>
          <div class="best-when" id="bestWhen"></div>
          <div class="best-none" id="bestNone">猶未有紀錄</div>
        </div>
        <div class="best-val" id="bestVal">—<small>分</small></div>
      </div>
      <button class="btn-main" id="startBtn" type="button">開始</button>
      <button class="btn-ghost big" id="historyBtn" type="button">看所有成績</button>
      <p class="rule">一回合 10 題，攏是兩字的詞，無限時間。看台文、聽音檔，照順序先揀<strong>第一字</strong>、才揀<strong>第二字</strong>的<strong>聲母</strong>，只考聲母，無考韻母佮聲調。一個聲母答對 5 分，滿分 100 分。</p>
      <p class="source">出處：教育部《臺灣台語常用詞辭典》<br>題目、台羅拼音佮音檔攏取自 <a href="https://sutian.moe.edu.tw/zh-hant/" target="_blank" rel="noopener">https://sutian.moe.edu.tw/zh-hant/</a></p>
    </div>
  </section>

  <!-- ===== quiz ===== -->
  <section id="quiz" hidden>
    <div class="bar">
      <div class="qno" id="qno">第 1 題 / 10</div>
      <div class="score">得分 <b id="scoreNow">0</b></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="word" id="word"></div>
    <button class="play" id="playBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      聽音檔
    </button>
    <div class="prompt" id="prompt"></div>
    <div class="keys" id="keys"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="next-row"><button class="btn-main" id="nextBtn" type="button" hidden>下一題</button></div>
  </section>

  <!-- ===== result ===== -->
  <section id="result" hidden>
    <div id="resHead" class="res-head"></div>
    <div id="reviewWrap">
      <h3>這回合的題目</h3>
      <ul class="review" id="review"></ul>
    </div>
    <h3>所有成績紀錄 <span style="font-family:var(--f-body);font-size:13px;color:var(--ink-soft);letter-spacing:0" id="recCount"></span></h3>
    <div class="table-wrap" id="records"></div>
    <div class="clear-zone" id="clearZone"><button class="link-btn" id="clearBtn" type="button">清除所有紀錄</button></div>
    <div class="res-actions">
      <button class="btn-main" id="againBtn" type="button">閣一回</button>
      <button class="btn-ghost" id="homeBtn" type="button">轉去封面</button>
    </div>
  </section>
</div>

<script src="words.js"></script>
<script src="audio.js"></script>
<script>
(() => {
  const ROUND = 10, PTS = 5, PER_Q = 2, KEY = 'yuksiu-taigi-siannbo-records';
  const GROUPS = [
    ['雙唇音', ['p', 'ph', 'b', 'm']],
    ['舌尖音', ['t', 'th', 'n', 'l']],
    ['舌根音', ['k', 'kh', 'g', 'ng']],
    ['齒音', ['ts', 'tsh', 's', 'j']],
    ['喉音', ['h']],
  ];
  const $ = id => document.getElementById(id);
  const SPEAK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  // Tâi-lô initial of one syllable; '0' = no initial
  function initialOf(syl) {
    const b = syl.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (/^(ng|m)h?$/.test(b)) return '0';
    const m = b.match(/^(tsh|ts|ph|th|kh|ng|p|b|m|t|n|l|k|g|h|s|j)(.+)$/);
    return m ? m[1] : '0';
  }

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
  };

  let audio = null;
  function play(id, btn) {
    const data = (window.AUDIO || {})[id];
    if (!data) return;
    if (audio) audio.pause();
    audio = new Audio('data:audio/mpeg;base64,' + data);
    if (btn) { btn.classList.add('on'); audio.onended = audio.onpause = () => btn.classList.remove('on'); }
    audio.play().catch(() => btn && btn.classList.remove('on'));
  }

  function show(id) {
    for (const s of ['cover', 'quiz', 'result']) $(s).hidden = s !== id;
    window.scrollTo(0, 0);
  }

  function renderBest() {
    const recs = store.get();
    $('bestNone').hidden = recs.length > 0;
    if (!recs.length) { $('bestVal').innerHTML = '—<small>分</small>'; $('bestWhen').innerHTML = ''; return; }
    const best = recs.reduce((a, r) => (r.score > a.score ? r : a));
    const [d, t] = best.date.split(' ');
    $('bestVal').innerHTML = best.score + '<small>分</small>';
    $('bestWhen').innerHTML = `<span>${d}</span><span>${t}</span>`;
  }

  // two-syllable words whose both syllables have an initial
  const BANK = window.WORDS.filter(w => w.s.length === 2 && w.s.every(s => initialOf(s) !== '0'));

  // pick 10 words, preferring ones that bring in initials not yet used this round
  function pickRound() {
    const pool = BANK.slice().sort(() => Math.random() - .5);
    const seen = new Set(), out = [];
    for (const w of pool) {
      if (out.length === ROUND) break;
      const inis = w.s.map(initialOf);
      if (inis.some(i => !seen.has(i))) { out.push(w); inis.forEach(i => seen.add(i)); }
    }
    for (const w of pool) { if (out.length === ROUND) break; if (!out.includes(w)) out.push(w); }
    return out.sort(() => Math.random() - .5);
  }

  let round = [], idx = 0, score = 0, results = [], picks = [];

  function start() {
    round = pickRound(); idx = 0; score = 0; results = [];
    show('quiz'); renderQ();
  }

  function renderQ() {
    const w = round[idx];
    picks = [];
    $('qno').textContent = `第 ${idx + 1} 題 / ${ROUND}`;
    $('scoreNow').textContent = score;
    $('dots').innerHTML = round.map((_, i) => {
      if (i === idx) return '<i class="now"></i>';
      if (i > idx) return '<i></i>';
      const n = results[i].n;
      return `<i class="${n === PER_Q ? 'ok' : n ? 'part' : 'no'}"></i>`;
    }).join('');
    const rom = i => `<span class="blank" id="blank${i}">？</span>${w.s[i].slice(initialOf(w.s[i]).length)}`;
    $('word').innerHTML =
      `<span class="han" id="han0">${w.h[0]}</span><span></span><span class="han" id="han1">${w.h[1]}</span>` +
      `<span class="rom">${rom(0)}</span><span class="rom hy">-</span><span class="rom">${rom(1)}</span>`;
    $('keys').innerHTML = GROUPS.map(([g, ks]) => `<div class="krow"><span class="gname">${g}</span><div class="kbtns">${
      ks.map(k => `<button type="button" class="key" data-k="${k}">${k}</button>`).join('')
    }</div></div>`).join('');
    $('feedback').textContent = ''; $('feedback').className = 'feedback';
    $('nextBtn').hidden = true;
    markCurrent();
    play(w.id, $('playBtn'));
  }

  function markCurrent() {
    const i = picks.length;
    for (const j of [0, 1]) {
      $('blank' + j).classList.toggle('now', j === i);
      $('han' + j).classList.toggle('now', j === i);
    }
    $('prompt').textContent = i < PER_Q ? `揀第 ${i + 1} 字「${round[idx].h[i]}」的聲母` : '';
  }

  function answer(k) {
    const w = round[idx];
    const i = picks.length;
    picks.push(k);
    const b = $('blank' + i);
    b.textContent = k; b.classList.add('picked');
    markCurrent();
    if (picks.length < PER_Q) return;

    const ans = w.s.map(initialOf);
    const n = ans.filter((a, j) => a === picks[j]).length;
    score += n * PTS;
    results.push({ w, n, picks: picks.slice(), ans });
    document.querySelectorAll('.key').forEach(btn => { btn.disabled = true; });
    ans.forEach((a, j) => {
      const el = $('blank' + j);
      el.classList.remove('picked');
      el.classList.add(a === picks[j] ? 'ok' : 'no');
      el.innerHTML = a === picks[j] ? a : `<s>${picks[j]}</s>${a}`;
    });
    $('scoreNow').textContent = score;
    $('feedback').className = 'feedback ' + (n === PER_Q ? 'ok' : 'no');
    $('feedback').innerHTML = (n === PER_Q ? '兩个攏答對！' : n ? '答對一个。' : '兩个攏毋著。') +
      `＋${n * PTS} 分　<span class="lo">${w.s.join('-')}</span>`;
    $('nextBtn').textContent = idx + 1 < ROUND ? '下一題' : '看成績';
    $('nextBtn').hidden = false;
    $('nextBtn').focus({ preventScroll: true });
  }

  function finish() {
    const recs = store.get();
    const prevBest = recs.length ? Math.max(...recs.map(r => r.score)) : -1;
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const rec = {
      score, correct: results.reduce((s, r) => s + r.n, 0), total: ROUND * PER_Q,
      date: `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      t: now.getTime(),
    };
    recs.push(rec); store.set(recs);
    $('resHead').innerHTML = `<h2>這回合成績</h2>
      <div class="big">${score}<small> 分</small></div>
      <div>答對 ${rec.correct} / ${rec.total} 个聲母</div>
      ${score > prevBest ? '<div class="new-best">新的最高成績</div>' : ''}`;
    $('reviewWrap').hidden = false;
    $('review').innerHTML = results.map((r, i) => `<li>
      <span class="mark ${r.n === PER_Q ? 'ok' : 'no'}">${r.n === PER_Q ? '○' : r.n ? '△' : '✕'}</span>
      <span><span class="rh">${r.w.h}</span>　<span class="rl">${r.w.s.join('-')}</span></span>
      <span class="ri">${r.ans.map((a, j) => a === r.picks[j] ? a : `${a}<span class="x">（揀 ${r.picks[j]}）</span>`).join('、')}</span>
      <button class="say" type="button" data-i="${i}" aria-label="播放 ${r.w.h}">${SPEAK}</button>
    </li>`).join('');
    renderRecords(rec.t);
    show('result');
  }

  function renderRecords(curT) {
    const recs = store.get();
    $('recCount').textContent = recs.length ? `共 ${recs.length} 筆` : '';
    $('clearZone').hidden = !recs.length;
    if (!recs.length) { $('records').innerHTML = '<div class="empty">猶未有成績紀錄，緊來耍一回！</div>'; return; }
    const best = Math.max(...recs.map(r => r.score));
    const rows = recs.slice().sort((a, b) => b.t - a.t);
    $('records').innerHTML = `<table><thead><tr><th>#</th><th>日期</th><th>時間</th><th>答對</th><th class="sc">分數</th></tr></thead><tbody>${
      rows.map((r, i) => `<tr class="${r.score === best ? 'top' : ''} ${r.t === curT ? 'cur' : ''}"><td>${rows.length - i}</td><td>${r.date.split(' ')[0]}</td><td>${r.date.split(' ')[1]}</td><td>${r.correct}/${r.total || ROUND}</td><td class="sc">${r.score}${r.score === best ? ' ★' : ''}</td></tr>`).join('')
    }</tbody></table>`;
  }

  function showHistory() {
    $('resHead').innerHTML = '<h2>所有成績紀錄</h2>';
    $('reviewWrap').hidden = true;
    renderRecords();
    show('result');
  }

  $('startBtn').onclick = start;
  $('againBtn').onclick = start;
  $('historyBtn').onclick = showHistory;
  $('homeBtn').onclick = () => { renderBest(); show('cover'); };
  $('playBtn').onclick = () => play(round[idx].id, $('playBtn'));
  $('keys').onclick = e => { const b = e.target.closest('.key'); if (b && !b.disabled) answer(b.dataset.k); };
  $('nextBtn').onclick = () => { idx++; idx < ROUND ? renderQ() : finish(); };
  $('review').onclick = e => { const b = e.target.closest('.say'); if (b) play(results[b.dataset.i].w.id); };
  // in-page confirmation (dialogs are unavailable in the viewer)
  $('clearZone').onclick = e => {
    const id = e.target.id;
    if (id === 'clearBtn') {
      $('clearZone').innerHTML = '確定欲清除所有紀錄？ <button class="link-btn danger" id="yesClear" type="button">確定清除</button><button class="link-btn" id="noClear" type="button">取消</button>';
    } else if (id === 'yesClear' || id === 'noClear') {
      if (id === 'yesClear') { store.set([]); renderBest(); }
      $('clearZone').innerHTML = '<button class="link-btn" id="clearBtn" type="button">清除所有紀錄</button>';
      renderRecords();
    }
  };

  renderBest();
})();
</script>
